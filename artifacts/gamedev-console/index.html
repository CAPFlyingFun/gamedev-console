<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>GameDev Console</title>
  <meta name="description" content="A focused developer cockpit for prompting AI, reviewing code, and pushing to GitHub." />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GameDev%20Console%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%2309090b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520100%2520100%2522%253E%253Crect%2520width%253D%2522100%2522%2520height%253D%2522100%2522%2520fill%253D%2522%252300ffd0%2522%252F%253E%253Cpath%2520d%253D%2522M20%252020%2520L80%252050%2520L20%252080%2520Z%2522%2520fill%253D%2522%252309090b%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2300ffd0'/%3E%3Cpath d='M20 20 L80 50 L20 80 Z' fill='%2309090b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --panel: #121214;
      --panel-border: #27272a;
      --accent: #00ffd0;
      --accent-hover: #00ccaa;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --error: #f87171;
      --success: #4ade80;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: 280px 1fr 400px;
      height: 100dvh;
    }
    @media (max-width: 1000px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 600px auto;
        overflow-y: auto;
      }
      .panel { height: auto; border-right: none; border-bottom: 1px solid var(--panel-border); }
    }
    .panel {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--panel-border);
      background: var(--panel);
      height: 100dvh;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; border-bottom: none; }
    
    .section { padding: 12px; border-bottom: 1px solid var(--panel-border); }
    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted); margin-bottom: 8px; font-weight: 600;
    }
    
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--panel-border);
      color: var(--text); padding: 6px 8px; font-size: 12px;
      font-family: var(--font-sans); border-radius: 4px; outline: none;
      width: 100%; box-sizing: border-box; margin-bottom: 6px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    
    button {
      background: var(--panel-border); color: var(--text);
      border: 1px solid transparent; padding: 6px 12px; font-size: 12px;
      border-radius: 4px; cursor: pointer; font-weight: 500;
      transition: all 0.2s; white-space: nowrap;
    }
    button:hover { background: var(--text-muted); color: #000; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 8px; }
    .input-group input { margin-bottom: 0; }
    
    .key-row { margin-bottom: 8px; }
    .key-row label { display: flex; align-items: center; font-size: 11px; margin-bottom: 4px; color: var(--text-muted); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; }
    .status-dot.set { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.unset { background: var(--error); box-shadow: 0 0 6px var(--error); }
    
    .recents { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
    .recent-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px;
      border-radius: 4px; cursor: pointer;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    }
    .recent-item:hover { background: var(--bg); color: var(--text); }
    .recent-name {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /*
     * The branch truncates before the name does. A long branch name is
     * otherwise wide enough to squeeze "CAPFlyingFun/Thronemound-Colony-Sim"
     * down to "CAPFl…", hiding the one field you actually pick the row by.
     * The full text stays on the row's title.
     */
    .recent-branch {
      /* Never shrinks below its own text — only capped. With shrink enabled,
       * "main" collapsed to "ma…" to make room for a long repo name. */
      flex: 0 0 auto; max-width: 42%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--accent); opacity: 0.65;
    }
    /* Hidden until hover so the row reads as a name, not a row of controls. */
    .recent-forget {
      background: none; border: none; padding: 0 2px; flex-shrink: 0;
      font-size: 13px; line-height: 1; color: var(--text-muted); opacity: 0;
    }
    .recent-item:hover .recent-forget { opacity: 0.55; }
    .recent-forget:hover { background: none; color: var(--error); opacity: 1; }

    .file-list { flex: 1; overflow-y: auto; padding-top: 4px; }

    .build-bar {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      padding: 6px 10px; border-top: 1px solid var(--panel-border);
      background: var(--panel);
      font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
    }
    #build-stamp { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .build-update {
      flex-shrink: 0; padding: 3px 8px; font-size: 10px; font-weight: 600;
      background: var(--accent); color: #000;
    }
    .build-update:hover { background: var(--accent-hover); color: #000; }
    .file-item {
      padding: 6px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
      border-left: 2px solid transparent;
      transition: all 0.1s;
    }
    .file-item:hover { background: var(--bg); color: var(--text); }
    .file-item.active { background: #00ffd011; color: var(--accent); border-left-color: var(--accent); }
    
    .middle-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid var(--panel-border); background: var(--bg);
    }
    .file-path { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
    
    .tabs { display: flex; gap: 4px; }
    .tab-btn { background: transparent; padding: 4px 8px; border-radius: 4px; color: var(--text-muted); }
    .tab-btn.active { background: var(--panel-border); color: var(--text); }
    
    .editor-wrapper { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    #editor-container { flex: 1; overflow: auto; height: 100%; display: flex; flex-direction: column; }
    .cm-editor { height: 100%; flex: 1; font-family: var(--font-mono) !important; font-size: 12px; }
    
    #preview-container { flex: 1; display: none; background: #fff; height: 100%; }
    #preview-iframe { width: 100%; height: 100%; border: none; background: #fff; }
    
    .commit-bar {
      display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--panel-border);
      background: var(--panel); align-items: center; flex-shrink: 0;
    }
    .commit-bar input { margin: 0; flex: 1; }
    
    .responses-area { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }
    
    .agent-card {
      border: 1px solid var(--panel-border); border-radius: 6px; margin-bottom: 12px;
      background: var(--panel); display: flex; flex-direction: column;
    }
    .agent-card-header {
      padding: 6px 10px; font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--panel-border);
      display: flex; justify-content: space-between; align-items: center;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .agent-card-content { padding: 10px; font-size: 12px; line-height: 1.5; color: var(--text); overflow-x: hidden; }
    
    .master-card { border-color: var(--accent); box-shadow: 0 0 10px #00ffd022; }
    .master-card .agent-card-header { background: #00ffd011; color: var(--accent); }
    /* The code cards are the deliverable — the plans above them are working notes. */
    .code-card { border-color: var(--success); }
    .code-card .agent-card-header { background: #4ade8011; color: var(--success); }

    .ctx-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 8px; font-size: 11px; color: var(--text-muted);
      cursor: pointer;
    }
    .ctx-row input { width: auto; margin: 0; accent-color: var(--accent); }
    select {
      background: var(--bg); border: 1px solid var(--panel-border); color: var(--text);
      padding: 6px 8px; font-size: 12px; font-family: var(--font-sans);
      border-radius: 4px; outline: none; box-sizing: border-box;
    }
    
    .code-block { margin: 8px 0; border: 1px solid var(--panel-border); border-radius: 4px; position: relative; background: #000; }
    .code-block pre { margin: 0; padding: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 11px; color: #a6accd; }
    .insert-btn {
      position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 10px;
      background: var(--panel); border: 1px solid var(--panel-border); opacity: 0.8;
    }
    .insert-btn:hover { background: var(--accent); color: #000; opacity: 1; }
    
    .loader { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .loader::after { content: ""; width: 8px; height: 8px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-text { color: var(--error); font-family: var(--font-mono); font-size: 11px; }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT PANEL -->
    <div class="panel" id="left-panel">
      <div class="section">
        <div class="section-title">API Keys</div>
        <div class="key-row">
          <label>OpenAI <span class="status-dot unset" id="status-openai"></span></label>
          <div class="input-group">
            <input type="password" id="input-openai" placeholder="sk-..." />
            <button id="btn-save-openai">Save</button>
            <button id="btn-clear-openai">Clear</button>
          </div>
        </div>
        <div class="key-row">
          <label>Claude <span class="status-dot unset" id="status-claude"></span></label>
          <div class="input-group">
            <input type="password" id="input-claude" placeholder="sk-ant-..." />
            <button id="btn-save-claude">Save</button>
            <button id="btn-clear-claude">Clear</button>
          </div>
        </div>
        <div class="key-row">
          <label>GitHub <span class="status-dot unset" id="status-github"></span></label>
          <div class="input-group">
            <input type="password" id="input-github" placeholder="ghp_..." />
            <button id="btn-save-github">Save</button>
            <button id="btn-clear-github">Clear</button>
          </div>
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">Repository</div>
        <input type="text" id="repo-owner" placeholder="Owner (e.g. torvalds)"
               list="recent-owners" autocomplete="off" />
        <datalist id="recent-owners"></datalist>
        <input type="text" id="repo-name" placeholder="Repo (e.g. linux)"
               list="recent-names" autocomplete="off" />
        <datalist id="recent-names"></datalist>
        <div class="input-group">
          <input type="text" id="repo-branch" value="main" placeholder="Branch" />
          <button id="btn-load-repo" class="btn-primary">Load</button>
        </div>
        <div class="recents" id="recents"></div>
      </div>
      
      <div class="section" style="padding-bottom:0; border-bottom:none;">
        <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
          Files
          <button id="btn-new-file" style="padding:2px 6px; font-size:10px;">+ New</button>
        </div>
      </div>
      <div class="file-list" id="file-list">
        <div style="padding: 12px; color: var(--text-muted); font-size: 11px;">No repository loaded.</div>
      </div>

      <div class="build-bar" id="build-bar">
        <span id="build-stamp" title="Loading build info…">&nbsp;</span>
        <button id="btn-reload" class="build-update" style="display:none;"
                title="A newer build is live">Update ready &mdash; reload</button>
      </div>
    </div>
    
    <!-- MIDDLE PANEL -->
    <div class="panel" id="middle-panel">
      <div class="middle-header">
        <div class="file-path" id="current-file-path">No file selected</div>
        <div class="tabs">
          <button class="tab-btn active" id="tab-editor">Editor</button>
          <button class="tab-btn" id="tab-preview">Preview</button>
          <button class="tab-btn" id="btn-refresh-preview" style="display:none;" title="Refresh Preview">↺</button>
        </div>
      </div>
      
      <div class="editor-wrapper">
        <div id="editor-container"></div>
        <div id="preview-container">
          <iframe id="preview-iframe" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
      
      <div class="commit-bar">
        <input type="text" id="commit-message" placeholder="Commit message..." />
        <button id="btn-push-commit" class="btn-primary">Push Commit</button>
      </div>
    </div>
    
    <!-- RIGHT PANEL -->
    <div class="panel" id="right-panel">
      <div class="section prompt-area">
        <div class="section-title">Plan &rarr; Merge &rarr; Code</div>
        <div class="input-group">
          <input type="text" id="model-openai" value="gpt-4o-mini"
                 title="ChatGPT — writes a plan" style="width:50%" />
          <input type="text" id="model-claude" value="claude-opus-5"
                 title="Claude — writes a plan, and writes the code" style="width:50%" />
        </div>
        <div class="input-group">
          <input type="text" id="model-master" value="gpt-4o"
                 title="Master — merges both plans and assigns the work. Put a reasoning model here if your account has one." style="width:50%" />
          <select id="coder-choice" style="width:50%" title="Who writes the code">
            <option value="claude">Claude codes</option>
            <option value="auto">Master decides</option>
            <option value="chatgpt">ChatGPT codes</option>
            <option value="both">Both code</option>
          </select>
        </div>
        <label class="ctx-row">
          <input type="checkbox" id="send-file" checked />
          Send the open file as context
        </label>
        <textarea id="prompt-input" placeholder="Describe the feature or fix..."></textarea>
        <button id="btn-submit-prompt" class="btn-primary" style="width: 100%;">Execute Prompt</button>
      </div>

      <div class="responses-area" id="responses-area">
        <div class="agent-card" id="card-openai" style="display:none;">
          <div class="agent-card-header">
            Plan &mdash; ChatGPT (<span id="label-model-openai"></span>)
            <span id="openai-status"></span>
          </div>
          <div class="agent-card-content" id="content-openai"></div>
        </div>

        <div class="agent-card" id="card-claude" style="display:none;">
          <div class="agent-card-header">
            Plan &mdash; Claude (<span id="label-model-claude"></span>)
            <span id="claude-status"></span>
          </div>
          <div class="agent-card-content" id="content-claude"></div>
        </div>

        <div class="agent-card master-card" id="card-master" style="display:none;">
          <div class="agent-card-header">
            Master plan
            <span id="master-status"></span>
          </div>
          <div class="agent-card-content" id="content-master"></div>
        </div>

        <div class="agent-card code-card" id="card-code-claude" style="display:none;">
          <div class="agent-card-header">
            Code &mdash; Claude
            <span id="code-claude-status"></span>
          </div>
          <div class="agent-card-content" id="content-code-claude"></div>
        </div>

        <div class="agent-card code-card" id="card-code-openai" style="display:none;">
          <div class="agent-card-header">
            Code &mdash; ChatGPT
            <span id="code-openai-status"></span>
          </div>
          <div class="agent-card-content" id="content-code-openai"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { EditorState } from "@codemirror/state";
    import { EditorView, keymap, lineNumbers, highlightActiveLineGutter, drawSelection, dropCursor } from "@codemirror/view";
    import { defaultKeymap, history, historyKeymap } from "@codemirror/commands";
    import { syntaxHighlighting, defaultHighlightStyle } from "@codemirror/language";
    import { javascript } from "@codemirror/lang-javascript";
    import { html } from "@codemirror/lang-html";
    import { css } from "@codemirror/lang-css";
    import { json } from "@codemirror/lang-json";
    import { oneDark } from "@codemirror/theme-one-dark";

    // --- SERVICE WORKER ---
    /*
     * REGISTERED AT THE APP'S OWN PATH, not at the site root. On GitHub Pages
     * the console lives under /gamedev-console/, and '/sw.js' there is either
     * a 404 or — worse, if the host site ever ships one — a worker whose
     * scope covers the whole domain. BASE_URL is baked in at build time from
     * BASE_PATH, so this is correct at the root and under any subpath.
     */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const base = import.meta.env.BASE_URL;
        navigator.serviceWorker.register(`${base}sw.js`, { scope: base }).catch(err => {
          console.error('ServiceWorker registration failed: ', err);
        });
      });
    }

    // --- STATE ---
    let editorView;
    let currentFile = { path: '', sha: null, isNew: false };
    
    // --- UTILS ---
    const getEl = id => document.getElementById(id);
    
    // GitHub API requires strict base64 encoding/decoding of UTF-8 text
    function decodeB64UTF8(b64) {
      const binString = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(binString.length);
      for (let i = 0; i < binString.length; i++) {
        bytes[i] = binString.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }
    
    function encodeB64UTF8(str) {
      const bytes = new TextEncoder().encode(str);
      let binString = "";
      for (let i = 0; i < bytes.length; i++) {
        binString += String.fromCharCode(bytes[i]);
      }
      return btoa(binString);
    }
    
    // --- BUILD STAMP ---
    /* Substituted at build time by vite.config.ts. */
    const BUILD = __BUILD_STAMP__;

    getEl('build-stamp').textContent = `v${BUILD.version} · ${BUILD.commit}`;
    getEl('build-stamp').title =
      `version ${BUILD.version}\ncommit ${BUILD.commit}\nbuilt ${BUILD.built}`;
    getEl('btn-reload').onclick = () => location.reload();

    /*
     * A deploy is invisible to a tab that is already open, and this app is a
     * PWA people leave running. So ask the server what it is serving and say
     * so, rather than letting the footer keep advertising a build that has
     * been replaced. no-store because the whole point of this file is that a
     * cached answer is the wrong answer.
     */
    async function checkForUpdate() {
      if (BUILD.commit === 'dev') return;   // local build; nothing to compare to
      try {
        const res = await fetch(`${import.meta.env.BASE_URL}version.json`, { cache: 'no-store' });
        if (!res.ok) return;
        const live = await res.json();
        if (live.commit && live.commit !== BUILD.commit) {
          getEl('btn-reload').style.display = 'block';
          getEl('build-stamp').title += `\n\nlive build is ${live.commit}`;
        }
      } catch {
        /* Offline, or the check is blocked — the app still works. */
      }
    }
    checkForUpdate();
    window.addEventListener('focus', checkForUpdate);
    setInterval(checkForUpdate, 10 * 60 * 1000);

    // --- KEY MANAGER ---
    function updateKeyStatus() {
      ['openai', 'claude', 'github'].forEach(k => {
        const hasKey = !!localStorage.getItem(`${k}Key`);
        const dot = getEl(`status-${k}`);
        dot.className = `status-dot ${hasKey ? 'set' : 'unset'}`;
        getEl(`input-${k}`).value = hasKey ? '********' : '';
      });
    }

    ['openai', 'claude', 'github'].forEach(k => {
      getEl(`btn-save-${k}`).onclick = () => {
        const val = getEl(`input-${k}`).value;
        if (val && val !== '********') {
          localStorage.setItem(`${k}Key`, val);
          updateKeyStatus();
        }
      };
      getEl(`btn-clear-${k}`).onclick = () => {
        localStorage.removeItem(`${k}Key`);
        updateKeyStatus();
      };
    });
    updateKeyStatus();

    // --- EDITOR ---
    function getLangExt(filename) {
      if (filename.endsWith('.html')) return html();
      if (filename.endsWith('.css')) return css();
      if (filename.endsWith('.json')) return json();
      return javascript();
    }

    const defaultExtensions = [
      lineNumbers(),
      highlightActiveLineGutter(),
      history(),
      drawSelection(),
      dropCursor(),
      keymap.of([...defaultKeymap, ...historyKeymap]),
      syntaxHighlighting(defaultHighlightStyle, {fallback: true}),
      oneDark
    ];

    function initEditor() {
      editorView = new EditorView({
        state: EditorState.create({
          doc: "// Welcome to GameDev Console.\n// Select a file to edit or create a new one.",
          extensions: [...defaultExtensions, javascript()]
        }),
        parent: getEl('editor-container')
      });
    }
    initEditor();

    function setEditorContent(content, filename) {
      const newState = EditorState.create({
        doc: content,
        extensions: [...defaultExtensions, getLangExt(filename)]
      });
      editorView.setState(newState);
      if (filename.endsWith('.html')) {
        updatePreview();
      }
    }

    window.insertToEditor = function(codeB64) {
      try {
        const code = decodeURIComponent(escape(atob(codeB64)));
        const transaction = editorView.state.update({
          changes: {from: editorView.state.selection.main.head, insert: code}
        });
        editorView.dispatch(transaction);
        editorView.focus();
      } catch(e) {
        console.error("Failed to insert code", e);
      }
    };

    // --- GITHUB ---
    async function apiGH(path, opts = {}) {
      const token = localStorage.getItem('githubKey');
      if (!token) throw new Error('GitHub token missing');
      const res = await fetch(`https://api.github.com${path}`, {
        ...opts,
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          ...(opts.headers || {})
        }
      });
      if (!res.ok) {
        let msg = res.statusText;
        try { const err = await res.json(); msg = err.message; } catch(e){}
        throw new Error(`GitHub: ${res.status} ${msg}`);
      }
      return res.json();
    }

    // --- RECENTLY OPENED ---
    const RECENTS_KEY = 'recentRepos';
    const RECENTS_MAX = 8;

    function readRecents() {
      try {
        const raw = JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]');
        return Array.isArray(raw) ? raw.filter(r => r && r.owner && r.repo) : [];
      } catch {
        return [];   // Corrupt entry shouldn't take the whole panel down.
      }
    }

    function writeRecents(list) {
      localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, RECENTS_MAX)));
      renderRecents();
    }

    /*
     * Only ever called after a tree loads. Remembering on click instead would
     * fill the list with typos and repos you have no access to — the ones you
     * least want one keystroke away.
     */
    function rememberRepo(owner, repo, branch) {
      const same = r => r.owner === owner && r.repo === repo && r.branch === branch;
      writeRecents([{ owner, repo, branch }, ...readRecents().filter(r => !same(r))]);
    }

    function renderRecents() {
      const list = readRecents();
      const box = getEl('recents');
      box.innerHTML = '';

      /* Each field suggests what you've actually used, independently — the
       * owner you want is often paired with a repo you haven't opened yet. */
      const fill = (id, values) => {
        const dl = getEl(id);
        dl.innerHTML = '';
        [...new Set(values)].forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          dl.appendChild(opt);
        });
      };
      fill('recent-owners', list.map(r => r.owner));
      fill('recent-names', list.map(r => r.repo));

      list.forEach(r => {
        const row = document.createElement('div');
        row.className = 'recent-item';
        row.title = `${r.owner}/${r.repo} @ ${r.branch}`;

        const name = document.createElement('span');
        name.className = 'recent-name';
        name.textContent = `${r.owner}/${r.repo}`;

        const branch = document.createElement('span');
        branch.className = 'recent-branch';
        branch.textContent = r.branch;

        const forget = document.createElement('button');
        forget.className = 'recent-forget';
        forget.textContent = '×';
        forget.title = 'Forget';
        forget.onclick = (e) => {
          e.stopPropagation();   // Don't load the thing being removed.
          writeRecents(readRecents().filter(
            x => !(x.owner === r.owner && x.repo === r.repo && x.branch === r.branch)));
        };

        row.append(name, branch, forget);
        row.onclick = () => {
          getEl('repo-owner').value = r.owner;
          getEl('repo-name').value = r.repo;
          getEl('repo-branch').value = r.branch;
          loadRepo();
        };
        box.appendChild(row);
      });
    }

    async function loadRepo() {
      const owner = getEl('repo-owner').value.trim();
      const repo = getEl('repo-name').value.trim();
      const branch = getEl('repo-branch').value.trim() || 'main';
      if (!owner || !repo) return alert('Owner and Repo required');

      const listEl = getEl('file-list');
      listEl.innerHTML = '<div class="loader" style="padding:12px;">Loading tree...</div>';

      try {
        const data = await apiGH(`/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (data.truncated) console.warn("Tree truncated");
        const files = data.tree.filter(t => t.type === 'blob');
        listEl.innerHTML = '';
        files.sort((a,b) => a.path.localeCompare(b.path)).forEach(f => {
          const div = document.createElement('div');
          div.className = 'file-item';
          div.textContent = f.path;
          div.title = f.path;
          div.onclick = () => loadFile(f.path);
          listEl.appendChild(div);
        });
        rememberRepo(owner, repo, branch);
      } catch(e) {
        listEl.innerHTML = `<div class="error-text" style="padding:12px;">${e.message}</div>`;
      }
    }

    getEl('btn-load-repo').onclick = loadRepo;
    renderRecents();

    async function loadFile(path) {
      const owner = getEl('repo-owner').value.trim();
      const repo = getEl('repo-name').value.trim();
      const branch = getEl('repo-branch').value.trim() || 'main';
      
      document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', el.textContent === path);
      });
      
      getEl('current-file-path').textContent = `Loading ${path}...`;
      try {
        const data = await apiGH(`/repos/${owner}/${repo}/contents/${path}?ref=${branch}`);
        const content = decodeB64UTF8(data.content);
        currentFile = { path: data.path, sha: data.sha, isNew: false };
        getEl('current-file-path').textContent = path;
        setEditorContent(content, path);
      } catch(e) {
        alert(e.message);
        getEl('current-file-path').textContent = 'Error loading file';
      }
    }

    getEl('btn-new-file').onclick = () => {
      const path = prompt("New file path (e.g. src/utils.js):");
      if (!path) return;
      currentFile = { path, sha: null, isNew: true };
      getEl('current-file-path').textContent = `${path} (New)`;
      setEditorContent("", path);
    };

    getEl('btn-push-commit').onclick = async () => {
      const owner = getEl('repo-owner').value.trim();
      const repo = getEl('repo-name').value.trim();
      const branch = getEl('repo-branch').value.trim() || 'main';
      const message = getEl('commit-message').value.trim() || `Update ${currentFile.path}`;
      if (!owner || !repo || !currentFile.path) return alert('No active file/repo.');
      
      const content = editorView.state.doc.toString();
      const btn = getEl('btn-push-commit');
      btn.textContent = 'Pushing...';
      btn.disabled = true;
      
      try {
        const body = {
          message,
          content: encodeB64UTF8(content),
          branch
        };
        if (currentFile.sha) body.sha = currentFile.sha;
        
        const res = await apiGH(`/repos/${owner}/${repo}/contents/${currentFile.path}`, {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        currentFile.sha = res.content.sha;
        currentFile.isNew = false;
        getEl('current-file-path').textContent = currentFile.path;
        
        // Refresh file list if new file
        if (currentFile.isNew) getEl('btn-load-repo').click();
        
        alert(`Commit pushed successfully:\n${res.commit.html_url}`);
        getEl('commit-message').value = '';
      } catch(e) {
        alert(e.message);
      } finally {
        btn.textContent = 'Push Commit';
        btn.disabled = false;
      }
    };

    // --- PREVIEW ---
    function updatePreview() {
      const content = editorView.state.doc.toString();
      getEl('preview-iframe').srcdoc = content;
    }
    getEl('tab-editor').onclick = () => {
      getEl('tab-editor').classList.add('active');
      getEl('tab-preview').classList.remove('active');
      getEl('editor-container').style.display = 'block';
      getEl('preview-container').style.display = 'none';
      getEl('btn-refresh-preview').style.display = 'none';
    };
    getEl('tab-preview').onclick = () => {
      getEl('tab-preview').classList.add('active');
      getEl('tab-editor').classList.remove('active');
      getEl('editor-container').style.display = 'none';
      getEl('preview-container').style.display = 'block';
      getEl('btn-refresh-preview').style.display = 'block';
      updatePreview();
    };
    getEl('btn-refresh-preview').onclick = updatePreview;

    // --- AGENTS ---
    function renderMarkdown(text, containerId) {
      const container = getEl(containerId);
      container.innerHTML = '';
      const parts = text.split(/(```[\s\S]*?```)/g);
      
      parts.forEach(part => {
        if (part.startsWith('```')) {
          const match = part.match(/```([a-z0-9-]*)\n([\s\S]*?)```/);
          const code = match ? match[2] : part.replace(/```/g, '');
          
          const wrapper = document.createElement('div');
          wrapper.className = 'code-block';
          
          const pre = document.createElement('pre');
          pre.textContent = code;
          
          const btn = document.createElement('button');
          btn.className = 'insert-btn';
          btn.textContent = 'INSERT';
          // Safely encode code for the inline onclick handler
          const b64 = btoa(unescape(encodeURIComponent(code)));
          btn.setAttribute('onclick', `insertToEditor('${b64}')`);
          
          wrapper.appendChild(pre);
          wrapper.appendChild(btn);
          container.appendChild(wrapper);
        } else if (part.trim()) {
          const p = document.createElement('div');
          p.style.marginBottom = '8px';
          p.style.whiteSpace = 'pre-wrap';
          p.textContent = part.trim();
          container.appendChild(p);
        }
      });
    }

    /*
     * `inlineSystem` folds the role instructions into the user turn instead of
     * sending a system message. OpenAI's reasoning models don't take the same
     * system role as the chat models, and the master step is exactly where you
     * want to put a reasoning model — so that call inlines rather than risking
     * a role rejection on a model the user is entitled to choose.
     *
     * No max_tokens is sent to OpenAI on purpose: reasoning models reject it in
     * favour of max_completion_tokens, and omitting it works on every model.
     */
    async function callOpenAI(prompt, systemPrompt, { model, inlineSystem } = {}) {
      const key = localStorage.getItem('openaiKey');
      if (!key) throw new Error('OpenAI key missing');
      const use = model || getEl('model-openai').value.trim() || 'gpt-4o-mini';
      const messages = inlineSystem
        ? [{ role: 'user', content: `${systemPrompt}\n\n---\n\n${prompt}` }]
        : [{ role: 'system', content: systemPrompt }, { role: 'user', content: prompt }];
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: use, messages })
      });
      if (!res.ok) throw new Error(`OpenAI: ${await res.text()}`);
      const data = await res.json();
      return data.choices[0].message.content;
    }

    /*
     * 16000, not 4096. This is a non-streaming request, so the ceiling is what
     * fits inside the HTTP timeout rather than the model's 128k limit — but
     * 4096 truncated any full-file rewrite of a real game file mid-function,
     * which reads as the model giving up rather than as a budget being hit.
     */
    const CLAUDE_MAX_TOKENS = 16000;

    async function callClaude(prompt, systemPrompt, { model } = {}) {
      const key = localStorage.getItem('claudeKey');
      if (!key) throw new Error('Claude key missing');
      const use = model || getEl('model-claude').value.trim() || 'claude-opus-5';
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: use,
          max_tokens: CLAUDE_MAX_TOKENS,
          system: systemPrompt,
          messages: [{role: 'user', content: prompt}]
        })
      });
      if (!res.ok) throw new Error(`Claude: ${await res.text()}`);
      const data = await res.json();
      /* Thinking blocks can precede the text on current models. */
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      if (!text) throw new Error(`Claude: no text in response (stop_reason: ${data.stop_reason})`);
      return text;
    }

    // --- PLAN -> MERGE -> CODE ---
    const ROLE = {
      planner: `You are a senior game developer producing a PLAN, not code.
Respond with:
1. What you would change, file by file.
2. The approach, plus one alternative you rejected and why.
3. Risks, edge cases, and what this could break.
4. How to verify it worked.
Do not write the implementation. Short fragments are fine only where prose
would be ambiguous. Be concrete about names, paths, and values.`,

      master: `You are the technical lead. Two engineers planned the same task
independently. Merge their plans into ONE plan: take the better call wherever
they disagree and say briefly why, and correct anything either got wrong.

Output exactly this shape and nothing else:

PLAN
<numbered steps, concrete enough to implement without guessing>

ASSIGNEE: claude | chatgpt | both
<one line on why>

Do not write the implementation — the assignee does that.`,

      coder: `You are an expert game developer. Implement the plan you are given.
Output complete, working code in fenced blocks, each preceded by the file path
it belongs to. If the plan is wrong or impossible, say so in one sentence and
implement the closest correct thing. Keep prose short — the code is the
deliverable.`,
    };

    /* Enough for a large source file, bounded so a huge one can't blow the
     * request up. The truncation is announced so the model doesn't treat a cut
     * file as the whole file. */
    const CONTEXT_LIMIT = 60000;

    function buildContext() {
      if (!getEl('send-file').checked || !currentFile.path) return '';
      const owner = getEl('repo-owner').value.trim();
      const repo = getEl('repo-name').value.trim();
      const branch = getEl('repo-branch').value.trim() || 'main';
      let body = editorView.state.doc.toString();
      let note = '';
      if (body.length > CONTEXT_LIMIT) {
        body = body.slice(0, CONTEXT_LIMIT);
        note = `\n\n[TRUNCATED at ${CONTEXT_LIMIT} characters — this is the start of the file, not all of it.]`;
      }
      return `\n\n--- OPEN FILE: ${owner}/${repo}@${branch} :: ${currentFile.path} ---\n`
        + `${body}${note}\n--- END OPEN FILE ---\n`;
    }

    /** Pull the master's routing decision out of its reply. */
    function readAssignee(masterText) {
      const m = /^\s*ASSIGNEE:\s*(claude|chatgpt|both)\b/im.exec(masterText || '');
      return m ? m[1].toLowerCase() : 'claude';   // default to the user's preference
    }

    /* Kept current rather than stamped at submit time, so the card headers name
     * a model before the first run instead of reading "PLAN — CLAUDE ( )". */
    function syncModelLabels() {
      getEl('label-model-openai').textContent = getEl('model-openai').value.trim();
      getEl('label-model-claude').textContent = getEl('model-claude').value.trim();
    }
    getEl('model-openai').oninput = syncModelLabels;
    getEl('model-claude').oninput = syncModelLabels;
    syncModelLabels();

    const show = (id, on) => { getEl(`card-${id}`).style.display = on ? 'flex' : 'none'; };
    const busy = (id) => { getEl(`${id}-status`).innerHTML = '<span class="loader"></span>'; };
    const done = (id, txt) => {
      getEl(`${id}-status`).textContent = 'DONE';
      renderMarkdown(txt, `content-${id}`);
    };
    const failed = (id, e) => {
      getEl(`${id}-status`).textContent = 'ERROR';
      getEl(`content-${id}`).innerHTML = `<div class="error-text">${e.message}</div>`;
    };

    getEl('btn-submit-prompt').onclick = async () => {
      const prompt = getEl('prompt-input').value.trim();
      if (!prompt) return;

      const btn = getEl('btn-submit-prompt');
      btn.disabled = true;
      btn.textContent = 'Planning...';

      const cards = ['openai', 'claude', 'master', 'code-claude', 'code-openai'];
      cards.forEach(id => { show(id, false); getEl(`content-${id}`).innerHTML = ''; });

      const task = `TASK:\n${prompt}${buildContext()}`;

      try {
        /* 1. Both models plan the same task, in parallel. */
        show('openai', true); busy('openai');
        show('claude', true); busy('claude');
        let planOAI = null, planClaude = null;
        await Promise.allSettled([
          callOpenAI(task, ROLE.planner)
            .then(t => { planOAI = t; done('openai', t); }).catch(e => failed('openai', e)),
          callClaude(task, ROLE.planner)
            .then(t => { planClaude = t; done('claude', t); }).catch(e => failed('claude', e)),
        ]);
        if (!planOAI && !planClaude) throw new Error('Both planners failed — nothing to merge.');

        /* 2. The master merges them into one plan and names an assignee. */
        btn.textContent = 'Merging...';
        show('master', true); busy('master');
        const masterModel = getEl('model-master').value.trim() || 'gpt-4o';
        const merged = `${task}\n\nCHATGPT'S PLAN:\n${planOAI || '(failed)'}`
          + `\n\nCLAUDE'S PLAN:\n${planClaude || '(failed)'}`;
        let plan;
        try {
          plan = await callOpenAI(merged, ROLE.master,
            { model: masterModel, inlineSystem: true });
        } catch (e) {
          /* Without a master there is no merged plan, so fall back rather than
           * silently coding from one planner's draft. */
          plan = await callClaude(merged, ROLE.master);
        }
        done('master', plan);

        /* 3. The assignee writes the code from the master's plan. */
        const choice = getEl('coder-choice').value;
        const who = choice === 'auto' ? readAssignee(plan) : choice;
        const brief = `${task}\n\nAPPROVED PLAN — implement this:\n${plan}`;

        btn.textContent = 'Coding...';
        const jobs = [];
        if (who === 'claude' || who === 'both') {
          show('code-claude', true); busy('code-claude');
          jobs.push(callClaude(brief, ROLE.coder)
            .then(t => done('code-claude', t)).catch(e => failed('code-claude', e)));
        }
        if (who === 'chatgpt' || who === 'both') {
          show('code-openai', true); busy('code-openai');
          jobs.push(callOpenAI(brief, ROLE.coder)
            .then(t => done('code-openai', t)).catch(e => failed('code-openai', e)));
        }
        await Promise.allSettled(jobs);
      } catch (e) {
        const box = getEl('content-master');
        box.innerHTML = `<div class="error-text">${e.message}</div>`;
        show('master', true);
        getEl('master-status').textContent = 'ERROR';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Execute Prompt';
      }
    };
  </script>
</body>
</html>
